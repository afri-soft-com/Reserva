name: Activer Google Sign In (Render)

# MODE_GOOGLE=production sur reserva-core (+ GOOGLE_CLIENT_IDS si secret présent), puis redeploy.

on:
  workflow_dispatch:

concurrency:
  group: enable-google-prod-${{ github.repository }}
  cancel-in-progress: false

jobs:
  enable-google:
    name: MODE_GOOGLE=production sur Render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Sync env Render + redeploy core
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_CORE: ${{ secrets.RENDER_SERVICE_CORE }}
          GOOGLE_CLIENT_IDS: ${{ secrets.GOOGLE_CLIENT_IDS }}
        run: |
          set -euo pipefail
          if [ -z "${RENDER_API_KEY:-}" ] || [ -z "${RENDER_SERVICE_CORE:-}" ]; then
            echo "RENDER_API_KEY / RENDER_SERVICE_CORE requis"
            exit 1
          fi
          node scripts/render-enable-google-prod.mjs
      - name: Attendre core live
        run: npm ci --ignore-scripts && npm run wait:render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_CORE: ${{ secrets.RENDER_SERVICE_CORE }}
          RENDER_WAIT_MS: "600000"
