name: Aligner seuils bannières MAJ

# Pose des seuils ABSOLUS (peut baisser) — pour que la bannière disparaisse
# dès que l'utilisateur a la version réellement publiée.

on:
  workflow_dispatch:
    inputs:
      client:
        description: "minSoft client (ex 1.0.3)"
        required: true
        default: "1.0.3"
      pro:
        description: "minSoft pro"
        required: true
        default: "1.0.3"
      web:
        description: "minSoft web"
        required: true
        default: "1.0.1"

jobs:
  set:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Set seuils
        run: >
          node scripts/set-app-versions-prod.mjs
          --client=${{ github.event.inputs.client }}
          --pro=${{ github.event.inputs.pro }}
          --web=${{ github.event.inputs.web }}
        env:
          GATEWAY_URL: ${{ secrets.GATEWAY_URL }}
          SMOKE_ADMIN_PHONE: ${{ secrets.SMOKE_ADMIN_PHONE }}
          SMOKE_ADMIN_PIN: ${{ secrets.SMOKE_ADMIN_PIN }}
