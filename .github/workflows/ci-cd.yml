name: CI/CD

# Qualité → sécurité → régression → mobile → Render → wait → smoke prod → stores
# Dépôt prod : afri-soft-com/Reserva (branche main)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cicd-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  quality:
    name: Qualité
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: reserva
          POSTGRES_PASSWORD: reserva
          POSTGRES_DB: reserva
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reserva -d reserva"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Init schémas Postgres
        run: PGPASSWORD=reserva psql -h localhost -U reserva -d reserva -f scripts/init-postgres.sql
      - name: Build shared + lint + coverage + builds
        run: npm run ci:quality
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000/api
          DATABASE_URL: postgresql://reserva:reserva@localhost:5432/reserva?schema=core
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci-jwt-secret-reserva-test-only
          CRON_SECRET: ci-cron-secret
          SERVICE_SECRET: ci-service-secret
          MODE_PAIEMENT: simulation
          MODE_SMS: simulation
          PAIEMENT_SIM_DETERMINISTE: "1"

  security:
    name: Sécurité
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Gitleaks (secrets)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz gitleaks
          ./gitleaks detect --source . --verbose --redact
      - name: npm audit (prod)
        continue-on-error: true
        run: |
          npm run ci:security
          npm audit --omit=dev --audit-level=high || true
          echo "::warning::Corriger les vulnérabilités npm (audit) avant le go-live stores si critical restantes."

  regression:
    name: Régression
    needs: [quality, security]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: reserva
          POSTGRES_PASSWORD: reserva
          POSTGRES_DB: reserva
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reserva -d reserva"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL_CORE: postgresql://reserva:reserva@localhost:5432/reserva?schema=core
      DATABASE_URL_HOTELS: postgresql://reserva:reserva@localhost:5432/reserva?schema=hotels
      DATABASE_URL_BOOKING: postgresql://reserva:reserva@localhost:5432/reserva?schema=booking
      DATABASE_URL_TRANSPORT: postgresql://reserva:reserva@localhost:5432/reserva?schema=transport
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-jwt-secret-reserva-test-only
      SERVICE_SECRET: ci-service-secret
      CRON_SECRET: ci-cron-secret
      MODE_PAIEMENT: simulation
      MODE_SMS: simulation
      MIGRATE_FALLBACK_PUSH: "1"
      PAIEMENT_SIM_DETERMINISTE: "1"
      SMOKE_WRITE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Init schémas Postgres
        run: PGPASSWORD=reserva psql -h localhost -U reserva -d reserva -f scripts/init-postgres.sql
      - name: Setup bases (backup → migrate) + builds
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          npm run build:shared
          npm run db:generate
          npm run db:generate:hotels
          npm run db:generate:booking
          npm run db:generate:transport
          node scripts/backup-service.mjs core --allow-empty
          DATABASE_URL="$DATABASE_URL_CORE" npm run db:migrate:core
          DATABASE_URL="$DATABASE_URL_CORE" npm run db:seed
          node scripts/backup-service.mjs hotels --allow-empty
          DATABASE_URL="$DATABASE_URL_HOTELS" npm run db:migrate:hotels
          DATABASE_URL="$DATABASE_URL_HOTELS" npm run db:seed:hotels
          node scripts/backup-service.mjs booking --allow-empty
          DATABASE_URL="$DATABASE_URL_BOOKING" npm run db:migrate:booking
          node scripts/backup-service.mjs transport --allow-empty
          DATABASE_URL="$DATABASE_URL_TRANSPORT" npm run db:migrate:transport
          DATABASE_URL="$DATABASE_URL_TRANSPORT" npm run db:seed:transport
          npm run build:api
          npm run build -w @reserva/hotels
          npm run build -w @reserva/booking
          npm run build -w @reserva/transport
          npm run build -w @reserva/gateway
      - name: Démarrer plateforme (sans web)
        run: |
          node scripts/ci-start-platform.mjs > /tmp/platform.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:4000/api/sante >/dev/null; then
              echo "Gateway prêt"
              curl -sf http://127.0.0.1:4000/api/sante | head -c 400
              exit 0
            fi
            sleep 2
          done
          echo "--- logs plateforme ---"
          tail -n 200 /tmp/platform.log || true
          exit 1
      - name: Vitest + intégration + smoke + OpenAPI + perf
        run: |
          npm run ci:regression
          GATEWAY_URL=http://127.0.0.1:4000/api npm run test:integration:all
        env:
          GATEWAY_URL: http://127.0.0.1:4000/api
          SMOKE_ADMIN_PHONE: "+243900000001"
          SMOKE_ADMIN_PIN: "1234"
          SMOKE_CLIENT_PHONE: "+243991234567"
          SMOKE_PRO_PHONE: "+243970000001"
          SMOKE_WRITE: "1"
          PAIEMENT_SIM_DETERMINISTE: "1"
          DATABASE_URL: ${{ env.DATABASE_URL_CORE }}
          PERF_FAIL_ON_SLOW: "0"
      - name: Build web admin
        run: npm run build:web
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:4000/api
      - name: Playwright e2e admin (chromium)
        working-directory: apps/web
        run: |
          npx playwright install --with-deps chromium
          PORT=3001 npm run start &
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:3001 >/dev/null; then break; fi
            sleep 2
          done
          if ! curl -sf http://127.0.0.1:3001 >/dev/null; then
            echo "Web admin non prêt sur :3001"
            exit 1
          fi
          npx playwright test --config=e2e/playwright.config.ts --project=chromium
        env:
          CI: true
          NEXT_PUBLIC_API_URL: http://127.0.0.1:4000/api
          GATEWAY_URL: http://127.0.0.1:4000/api
          DATABASE_URL: ${{ env.DATABASE_URL_CORE }}

  mobile-quality:
    name: Mobile (analyze + test)
    needs: [quality, security]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: dart analyze
        # warnings fatals par défaut ; infos (deprecated) non bloquantes
        run: dart analyze lib/
      - name: flutter test
        run: flutter test

  deploy-render:
    name: Déployer Render
    needs: [quality, security, regression, mobile-quality]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - name: Trigger Render deploys (API)
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SRV_CORE: ${{ secrets.RENDER_SERVICE_CORE }}
          SRV_HOTELS: ${{ secrets.RENDER_SERVICE_HOTELS }}
          SRV_TRANSPORT: ${{ secrets.RENDER_SERVICE_TRANSPORT }}
          SRV_BOOKING: ${{ secrets.RENDER_SERVICE_BOOKING }}
          SRV_GATEWAY: ${{ secrets.RENDER_SERVICE_GATEWAY }}
          SRV_WEB: ${{ secrets.RENDER_SERVICE_WEB }}
        run: |
          set -euo pipefail
          if [ -z "${RENDER_API_KEY:-}" ]; then
            echo "Secret RENDER_API_KEY manquant"
            exit 1
          fi
          deploy() {
            name="$1"
            id="$2"
            if [ -z "$id" ]; then
              echo "⚠ RENDER_SERVICE_${name^^} vide"
              exit 1
            fi
            echo "→ Deploy $name ($id)"
            code=$(curl -sS -o /tmp/deploy.out -w "%{http_code}" \
              -X POST "https://api.render.com/v1/services/${id}/deploys" \
              -H "Authorization: Bearer ${RENDER_API_KEY}" \
              -H "Accept: application/json" \
              -H "Content-Type: application/json" \
              -d '{}')
            echo "  HTTP $code $(head -c 200 /tmp/deploy.out)"
            if [ "$code" != "200" ] && [ "$code" != "201" ] && [ "$code" != "202" ]; then
              echo "Échec deploy API $name"
              exit 1
            fi
          }
          deploy core "$SRV_CORE"
          deploy hotels "$SRV_HOTELS"
          deploy transport "$SRV_TRANSPORT"
          deploy booking "$SRV_BOOKING"
          deploy gateway "$SRV_GATEWAY"
          deploy web "$SRV_WEB"
          echo "✓ Déploiements Render déclenchés via API"

  wait-render:
    name: Attendre Render Ready
    needs: [deploy-render]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Wait services live + ping gateway
        run: npm run wait:render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_CORE: ${{ secrets.RENDER_SERVICE_CORE }}
          RENDER_SERVICE_HOTELS: ${{ secrets.RENDER_SERVICE_HOTELS }}
          RENDER_SERVICE_TRANSPORT: ${{ secrets.RENDER_SERVICE_TRANSPORT }}
          RENDER_SERVICE_BOOKING: ${{ secrets.RENDER_SERVICE_BOOKING }}
          RENDER_SERVICE_GATEWAY: ${{ secrets.RENDER_SERVICE_GATEWAY }}
          RENDER_SERVICE_WEB: ${{ secrets.RENDER_SERVICE_WEB }}
          GATEWAY_URL: ${{ secrets.GATEWAY_URL }}
          RENDER_WAIT_MS: "900000"

  smoke-prod:
    name: Smoke production
    needs: [wait-render]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Ensure catalogue prod (seed si vide)
        run: npm run ensure:prod-catalogue
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          GATEWAY_URL: ${{ secrets.GATEWAY_URL }}
      - name: Smoke prod (strict lecture+écriture — bloque stores)
        run: npm run smoke:prod
        env:
          GATEWAY_URL: ${{ secrets.GATEWAY_URL }}
          SMOKE_ADMIN_PHONE: ${{ secrets.SMOKE_ADMIN_PHONE }}
          SMOKE_ADMIN_PIN: ${{ secrets.SMOKE_ADMIN_PIN }}
          SMOKE_CLIENT_PHONE: ${{ secrets.SMOKE_CLIENT_PHONE }}
          SMOKE_PRO_PHONE: ${{ secrets.SMOKE_PRO_PHONE }}
          SMOKE_WRITE: "1"
          PAIEMENT_SIM_DETERMINISTE: "1"
      - name: Contrat OpenAPI prod
        run: node scripts/check-openapi-contrat.mjs
        env:
          GATEWAY_URL: ${{ secrets.GATEWAY_URL }}
      - name: Perf légère (informatif)
        continue-on-error: true
        run: node scripts/perf-smoke.mjs
        env:
          GATEWAY_URL: ${{ secrets.GATEWAY_URL }}
          PERF_SAMPLES: "15"
          PERF_FAIL_ON_SLOW: "0"

  deploy-android:
    name: Play Store
    needs: [smoke-prod, mobile-quality]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    defaults:
      run:
        working-directory: apps/mobile_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter pub get
        run: flutter pub get
      - name: Inject versionCode
        run: |
          ruby -e "
            path='pubspec.yaml'
            t=File.read(path)
            t=t.sub(/version:\s*([^\+\n]+)\+\d+/, 'version: \\1+${{ github.run_number }}')
            File.write(path, t)
            puts File.read(path).lines.grep(/version:/).first
          "
      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
      - name: Build App Bundles (Client + Pro)
        env:
          API_URL: ${{ secrets.API_URL_PROD }}
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
        run: |
          flutter build appbundle --flavor client -t lib/main.dart --release \
            --dart-define=API_URL="$API_URL" \
            --dart-define=GOOGLE_SERVER_CLIENT_ID="${GOOGLE_SERVER_CLIENT_ID:-}"
          flutter build appbundle --flavor pro -t lib/main_pro.dart --release \
            --dart-define=API_URL="$API_URL" \
            --dart-define=GOOGLE_SERVER_CLIENT_ID="${GOOGLE_SERVER_CLIENT_ID:-}"
      - name: Setup Ruby / Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: apps/mobile_flutter/android
      - name: Upload Play Store (Client + Pro)
        working-directory: apps/mobile_flutter/android
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$PLAY_SERVICE_ACCOUNT_JSON" > play-service-account.json
          gem install fastlane --no-document
          fastlane deploy

  deploy-ios:
    name: App Store
    needs: [smoke-prod, mobile-quality]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-14
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    defaults:
      run:
        working-directory: apps/mobile_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter pub get
        run: flutter pub get
      - name: Inject CFBundleVersion
        run: |
          ruby -e "
            path='pubspec.yaml'
            t=File.read(path)
            t=t.sub(/version:\s*([^\+\n]+)\+\d+/, 'version: \\1+${{ github.run_number }}')
            File.write(path, t)
            puts File.read(path).lines.grep(/version:/).first
          "
      - name: CocoaPods
        working-directory: apps/mobile_flutter/ios
        run: pod install --repo-update
      - name: Import signing + ExportOptions (Client + Pro)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISION_PROFILE_CLIENT_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_CLIENT_BASE64 }}
          IOS_PROVISION_PROFILE_PRO_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_PRO_BASE64 }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN=reserva-ci.keychain-db
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          echo "$IOS_CERTIFICATE_BASE64" | base64 -d > /tmp/cert.p12
          security import /tmp/cert.p12 -k "$KEYCHAIN" -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed 's/"//g')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$KEYCHAIN"

          PROF_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROF_DIR"

          install_profile() {
            local b64="$1"
            local label="$2"
            if [ -z "${b64:-}" ]; then
              echo "⚠ Profil $label manquant"
              return 1
            fi
            local tmp="/tmp/${label}.mobileprovision"
            echo "$b64" | base64 -d > "$tmp"
            local uuid
            uuid=$(/usr/libexec/PlistBuddy -c 'Print UUID' /dev/stdin <<< "$(security cms -D -i "$tmp")" 2>/dev/null \
              || security cms -D -i "$tmp" | plutil -extract UUID raw -o - -)
            cp "$tmp" "$PROF_DIR/${uuid}.mobileprovision"
            echo "✓ Profil $label → $uuid"
          }

          CLIENT_B64="${IOS_PROVISION_PROFILE_CLIENT_BASE64:-$IOS_PROVISION_PROFILE_BASE64}"
          PRO_B64="${IOS_PROVISION_PROFILE_PRO_BASE64:-}"
          install_profile "$CLIENT_B64" "reserva-client"
          if [ -n "${PRO_B64:-}" ]; then
            install_profile "$PRO_B64" "reserva-pro"
          else
            echo "⚠ IOS_PROVISION_PROFILE_PRO_BASE64 vide — build Pro peut échouer"
          fi

          sed -i.bak "s#\$(APPLE_TEAM_ID)#${APPLE_TEAM_ID}#g" ios/ExportOptions.client.plist
          sed -i.bak "s#\$(APPLE_TEAM_ID)#${APPLE_TEAM_ID}#g" ios/ExportOptions.pro.plist
          if [ -f ios/ExportOptions.plist ]; then
            sed -i.bak "s#\$(APPLE_TEAM_ID)#${APPLE_TEAM_ID}#g" ios/ExportOptions.plist
          fi
      - name: Build IPA Client + Pro
        env:
          API_URL: ${{ secrets.API_URL_PROD }}
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
        run: |
          flutter build ipa --flavor client -t lib/main.dart --release \
            --dart-define=API_URL="$API_URL" \
            --dart-define=GOOGLE_SERVER_CLIENT_ID="${GOOGLE_SERVER_CLIENT_ID:-}" \
            --export-options-plist=ios/ExportOptions.client.plist
          flutter build ipa --flavor pro -t lib/main_pro.dart --release \
            --dart-define=API_URL="$API_URL" \
            --dart-define=GOOGLE_SERVER_CLIENT_ID="${GOOGLE_SERVER_CLIENT_ID:-}" \
            --export-options-plist=ios/ExportOptions.pro.plist
      - name: Setup Ruby / Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          working-directory: apps/mobile_flutter/ios
      - name: Upload App Store (Client + Pro)
        working-directory: apps/mobile_flutter/ios
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          mkdir -p fastlane
          printf '%s' "$APP_STORE_CONNECT_API_KEY_P8" > fastlane/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8
          gem install fastlane --no-document
          fastlane deploy
