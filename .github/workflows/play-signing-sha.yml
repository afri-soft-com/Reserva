# Affiche les SHA Play App Signing (pour Google OAuth Android erreur 10).
name: Play signing SHA
on:
  workflow_dispatch:
jobs:
  sha:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android build-tools (apksigner)
        uses: android-actions/setup-android@v3
        with:
          packages: build-tools;35.0.0
      - name: Print SHA-1 / SHA-256
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$PLAY_SERVICE_ACCOUNT_JSON" > play-service-account.json
          export PATH="$ANDROID_HOME/build-tools/35.0.0:$PATH"
          apksigner --version || true
          PLAY_SA_JSON="$PWD/play-service-account.json" node scripts/play-app-signing-sha.mjs
      - name: Upload downloaded APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: play-signing-apks
          path: play-signing-*.apk
          if-no-files-found: ignore
