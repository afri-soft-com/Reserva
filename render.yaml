# Blueprint Render — PostgreSQL + Redis + microservices RESERVA
# autoDeploy: false → déploiement via CI (RENDER_API_KEY)
# Node pin: engines.node = 22.x + .node-version

previewsEnabled: false

databases:
  - name: reserva-db
    plan: basic_256mb
    region: frankfurt
    postgresMajorVersion: "16"
    databaseName: reserva
    user: reserva
    ipAllowList:
      - source: 0.0.0.0/0
        description: reserva services

envVarGroups:
  - name: reserva-prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: SERVICE_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: 7d
      - key: MODE_PAIEMENT
        value: simulation
      - key: MODE_SMS
        value: simulation
      - key: HOLD_MINUTES
        value: "15"
      - key: MIGRATE_FALLBACK_PUSH
        value: "1"
      - key: REDIS_URL
        fromService:
          name: reserva-redis
          type: keyvalue
          property: connectionString

services:
  - type: keyvalue
    name: reserva-redis
    plan: starter
    region: frankfurt
    maxmemoryPolicy: allkeys-lru
    ipAllowList:
      - source: 0.0.0.0/0
        description: reserva services

  - type: web
    name: reserva-core
    runtime: node
    plan: starter
    region: frankfurt
    rootDir: .
    autoDeploy: false
    buildCommand: NPM_CONFIG_PRODUCTION=false npm ci && npm run build:shared && npm run db:generate && npm run build -w apps/api
    # Migrate/backup hors start: les disques Render historiques masquent */prisma au runtime.
    # Migrations: job CI (DATABASE_URL) ou one-off. Start = process HTTP uniquement.
    startCommand: npm run start -w apps/api
    healthCheckPath: /api/sante
    envVars:
      - fromGroup: reserva-prod
      - key: DATABASE_URL
        fromDatabase:
          name: reserva-db
          property: connectionString
      - key: BACKUP_DIR
        value: /var/data/backups
      - key: WEB_URL
        value: https://reserva-web-b9au.onrender.com

  - type: web
    name: reserva-hotels
    runtime: node
    plan: starter
    region: frankfurt
    rootDir: .
    autoDeploy: false
    buildCommand: NPM_CONFIG_PRODUCTION=false npm ci && npm run build:shared && npm run db:generate:hotels && npm run build -w @reserva/hotels
    startCommand: npm run start -w @reserva/hotels
    healthCheckPath: /api/sante
    envVars:
      - fromGroup: reserva-prod
      - key: DATABASE_URL
        fromDatabase:
          name: reserva-db
          property: connectionString
      - key: WEB_URL
        value: https://reserva-web-b9au.onrender.com

  - type: web
    name: reserva-transport
    runtime: node
    plan: starter
    region: frankfurt
    rootDir: .
    autoDeploy: false
    buildCommand: NPM_CONFIG_PRODUCTION=false npm ci && npm run build:shared && npm run db:generate:transport && npm run build -w @reserva/transport
    startCommand: npm run start -w @reserva/transport
    healthCheckPath: /api/sante
    envVars:
      - fromGroup: reserva-prod
      - key: DATABASE_URL
        fromDatabase:
          name: reserva-db
          property: connectionString
      - key: WEB_URL
        value: https://reserva-web-b9au.onrender.com

  - type: web
    name: reserva-booking
    runtime: node
    plan: starter
    region: frankfurt
    rootDir: .
    autoDeploy: false
    buildCommand: NPM_CONFIG_PRODUCTION=false npm ci && npm run build:shared && npm run db:generate:booking && npm run build -w @reserva/booking
    startCommand: npm run start -w @reserva/booking
    healthCheckPath: /api/sante
    envVars:
      - fromGroup: reserva-prod
      - key: DATABASE_URL
        fromDatabase:
          name: reserva-db
          property: connectionString
      - key: WEB_URL
        value: https://reserva-web-b9au.onrender.com
      - key: HOTELS_URL
        value: https://reserva-hotels.onrender.com
      - key: TRANSPORT_URL
        value: https://reserva-transport.onrender.com

  - type: web
    name: reserva-gateway
    runtime: node
    plan: starter
    region: frankfurt
    rootDir: .
    autoDeploy: false
    buildCommand: NPM_CONFIG_PRODUCTION=false npm ci && npm run build:shared && npm run build -w @reserva/gateway
    startCommand: npm run start -w @reserva/gateway
    healthCheckPath: /api/sante
    envVars:
      - fromGroup: reserva-prod
      - key: WEB_URL
        value: https://reserva-web-b9au.onrender.com
      - key: CORE_URL
        value: https://reserva-core.onrender.com
      - key: HOTELS_URL
        value: https://reserva-hotels.onrender.com
      - key: BOOKING_URL
        value: https://reserva-booking-ogpd.onrender.com
      - key: TRANSPORT_URL
        value: https://reserva-transport.onrender.com

  - type: web
    name: reserva-web
    runtime: node
    plan: starter
    region: frankfurt
    rootDir: .
    autoDeploy: false
    buildCommand: NPM_CONFIG_PRODUCTION=false npm ci && npm run build:shared && npm run build -w apps/web
    startCommand: npm run start -w apps/web
    healthCheckPath: /
    envVars:
      - fromGroup: reserva-prod
      - key: NEXT_PUBLIC_API_URL
        value: https://reserva-gateway.onrender.com/api
