# Blueprint Render — PostgreSQL + Redis + microservices RESERVA
# autoDeploy: false → déploiement via CI (RENDER_API_KEY)
# Backup: disk persistant sur core (`BACKUP_DIR=/var/data/backups`)
# Schéma: prisma migrate deploy (baseline + resolve si DB déjà via db push)

previewsEnabled: false

databases:
  - name: reserva-db
    plan: basic_256mb
    region: frankfurt
    postgresMajorVersion: "16"
    databaseName: reserva
    user: reserva
    ipAllowList:
      - source: 0.0.0.0/0
        description: reserva services

envVarGroups:
  - name: reserva-prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: SERVICE_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: 7d
      - key: MODE_PAIEMENT
        value: simulation
      - key: MODE_SMS
        value: simulation
      - key: HOLD_MINUTES
        value: "15"
      - key: MIGRATE_FALLBACK_PUSH
        value: "1"
      - key: REDIS_URL
        fromService:
          name: reserva-redis
          type: keyvalue
          property: connectionString

services:
  - type: keyvalue
    name: reserva-redis
    plan: starter
    region: frankfurt
    maxmemoryPolicy: allkeys-lru
    ipAllowList:
      - source: 0.0.0.0/0
        description: reserva services

  - type: web
    name: reserva-core
    runtime: node
    plan: starter
    region: frankfurt
    rootDir: .
    autoDeploy: false
    disk:
      name: reserva-backups
      mountPath: /var/data
      sizeGB: 2
    buildCommand: >
      (command -v pg_dump >/dev/null || (apt-get update && apt-get install -y postgresql-client)) &&
      npm ci && npm run build:shared && npm run db:generate && npm run build -w apps/api
    startCommand: >
      node scripts/backup-service.mjs core --allow-empty &&
      node scripts/db-migrate-service.mjs core &&
      npm run start -w apps/api
    healthCheckPath: /api/sante
    envVars:
      - fromGroup: reserva-prod
      - key: DATABASE_URL
        fromDatabase:
          name: reserva-db
          property: connectionString
      - key: BACKUP_DIR
        value: /var/data/backups
      - key: WEB_URL
        value: https://reserva-web-b9au.onrender.com

  - type: web
    name: reserva-hotels
    runtime: node
    plan: starter
    region: frankfurt
    rootDir: .
    autoDeploy: false
    buildCommand: >
      (command -v pg_dump >/dev/null || (apt-get update && apt-get install -y postgresql-client)) &&
      npm ci && npm run build:shared && npm run db:generate:hotels && npm run build -w @reserva/hotels
    startCommand: >
      node scripts/backup-service.mjs hotels --allow-empty &&
      node scripts/db-migrate-service.mjs hotels &&
      npm run start -w @reserva/hotels
    healthCheckPath: /api/sante
    envVars:
      - fromGroup: reserva-prod
      - key: DATABASE_URL
        fromDatabase:
          name: reserva-db
          property: connectionString
      - key: WEB_URL
        value: https://reserva-web-b9au.onrender.com

  - type: web
    name: reserva-transport
    runtime: node
    plan: starter
    region: frankfurt
    rootDir: .
    autoDeploy: false
    buildCommand: >
      (command -v pg_dump >/dev/null || (apt-get update && apt-get install -y postgresql-client)) &&
      npm ci && npm run build:shared && npm run db:generate:transport && npm run build -w @reserva/transport
    startCommand: >
      node scripts/backup-service.mjs transport --allow-empty &&
      node scripts/db-migrate-service.mjs transport &&
      npm run start -w @reserva/transport
    healthCheckPath: /api/sante
    envVars:
      - fromGroup: reserva-prod
      - key: DATABASE_URL
        fromDatabase:
          name: reserva-db
          property: connectionString
      - key: WEB_URL
        value: https://reserva-web-b9au.onrender.com

  - type: web
    name: reserva-booking
    runtime: node
    plan: starter
    region: frankfurt
    rootDir: .
    autoDeploy: false
    buildCommand: >
      (command -v pg_dump >/dev/null || (apt-get update && apt-get install -y postgresql-client)) &&
      npm ci && npm run build:shared && npm run db:generate:booking && npm run build -w @reserva/booking
    startCommand: >
      node scripts/backup-service.mjs booking --allow-empty &&
      node scripts/db-migrate-service.mjs booking &&
      npm run start -w @reserva/booking
    healthCheckPath: /api/sante
    envVars:
      - fromGroup: reserva-prod
      - key: DATABASE_URL
        fromDatabase:
          name: reserva-db
          property: connectionString
      - key: WEB_URL
        value: https://reserva-web-b9au.onrender.com
      - key: HOTELS_URL
        value: https://reserva-hotels.onrender.com
      - key: TRANSPORT_URL
        value: https://reserva-transport.onrender.com

  - type: web
    name: reserva-gateway
    runtime: node
    plan: starter
    region: frankfurt
    rootDir: .
    autoDeploy: false
    buildCommand: npm ci && npm run build:shared && npm run build -w @reserva/gateway
    startCommand: npm run start -w @reserva/gateway
    healthCheckPath: /api/sante
    envVars:
      - fromGroup: reserva-prod
      - key: WEB_URL
        value: https://reserva-web-b9au.onrender.com
      - key: CORE_URL
        value: https://reserva-core.onrender.com
      - key: HOTELS_URL
        value: https://reserva-hotels.onrender.com
      - key: BOOKING_URL
        value: https://reserva-booking-ogpd.onrender.com
      - key: TRANSPORT_URL
        value: https://reserva-transport.onrender.com

  - type: web
    name: reserva-web
    runtime: node
    plan: starter
    region: frankfurt
    rootDir: .
    autoDeploy: false
    buildCommand: npm ci && npm run build:shared && npm run build -w apps/web
    startCommand: npm run start -w apps/web
    healthCheckPath: /
    envVars:
      - fromGroup: reserva-prod
      - key: NEXT_PUBLIC_API_URL
        value: https://reserva-gateway.onrender.com/api
